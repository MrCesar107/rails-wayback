name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build and push to RubyGems
    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://rubygems.org/gems/rails-wayback

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec

      - name: Audit dependencies
        run: bundle exec bundler-audit check --update

      - name: Verify tag matches gem version
        run: |
          gem_version="v$(ruby -Ilib -r rails_wayback/version -e 'print RailsWayback::VERSION')"
          tag_version="${GITHUB_REF_NAME}"
          if [ "$gem_version" != "$tag_version" ]; then
            echo "Tag ($tag_version) does not match gem version ($gem_version)" >&2
            exit 1
          fi

      - name: Release gem
        uses: rubygems/release-gem@v1
