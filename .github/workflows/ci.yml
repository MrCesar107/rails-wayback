name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Bundler Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Audit dependencies
        run: bundle exec bundler-audit check --update

  lint:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  test:
    name: RSpec (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails.version }})
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.rails.gemfile }}.gemfile
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails:
          - version: "8.0"
            gemfile: rails_8_0
          - version: "8.1"
            gemfile: rails_8_1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Show resolved versions
        run: |
          bundle exec ruby -rbundler -rrails -e 'puts "Ruby #{RUBY_VERSION}, Rails #{Rails.version}, Bundler #{Bundler::VERSION}"'

      - name: Run RSpec
        run: bundle exec rspec
